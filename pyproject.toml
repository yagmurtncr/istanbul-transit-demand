[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "istanbul-transit-demand"
version = "0.1.0"
description = "Hourly public transport demand forecasting for Istanbul (İBB open data)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1", "numpy>=1.26", "pyarrow>=14", "requests>=2.31", "holidays>=0.50",
  "scikit-learn>=1.4", "scipy>=1.11", "statsmodels>=0.14", "xgboost>=2.0", "shap>=0.45",
  "matplotlib>=3.8", "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "jupyter>=1.0"]
mlops = ["mlflow>=2.12", "streamlit>=1.35"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

name: Analysis

# Runs EDA, statistical tests and model comparison on the aggregated İBB data
# and commits reports/results.md + figures back to the repository.
on:
  workflow_dispatch:
  push:
    paths:
      - "data/aggregated/**"
      - "scripts/run_analysis.py"
      - "src/transit/analysis/**"
      - "src/transit/models/**"
      - "src/transit/features/**"

permissions:
  contents: write

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python scripts/run_analysis.py
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "Update analysis reports [skip ci]"
          git push

name: Analysis

# Runs EDA, statistical tests and model comparison on the aggregated İBB data
# and commits reports/results.md + figures back to the repository.
on:
  workflow_dispatch:
  push:
    paths:
      - "data/aggregated/**"
      - "scripts/run_analysis.py"
      - "scripts/run_factor_analysis.py"
      - "data/detail/**"
      - "warehouse/**"
      - "scripts/business_report.py"
      - "tableau/export_tableau.py"
      - "src/transit/analysis/**"
      - "src/transit/models/**"
      - "src/transit/features/**"
      - "src/transit/data/**"
      - "app/**"
      - "scripts/screenshot_dashboard.py"
      - "scripts/readme_figures.py"

permissions:
  contents: write

# Runs that commit generated files wait for each other instead of racing.
concurrency:
  group: commit-generated-files
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python scripts/run_analysis.py
      - run: python scripts/run_factor_analysis.py
      - name: SQL warehouse (DuckDB) + business report
        run: |
          pip install duckdb openpyxl
          python warehouse/build.py
          python scripts/business_report.py
          python tableau/export_tableau.py
      - name: README figures
        run: python scripts/readme_figures.py
      - name: Dashboard screenshots
        run: |
          pip install -e ".[app]" playwright
          python -m playwright install --with-deps chromium
          python scripts/screenshot_dashboard.py
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports tableau
          git diff --cached --quiet && exit 0
          git commit -m "Update analysis reports [skip ci]"
          git pull --rebase
          git push
